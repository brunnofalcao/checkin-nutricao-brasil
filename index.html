<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check-in SP">
  <meta name="theme-color" content="#0E0A12">
  <meta name="description" content="Credenciamento de eventos Science Play">

  <title>Check-in · Science Play</title>

  <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/dlzrfhwin/image/upload/c_scale,w_26/c_lpad,w_32,h_32,b_rgb:0e0a12/f_png/Isotipo_Science_Play_Oficial_Branca_zge9ut.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://res.cloudinary.com/dlzrfhwin/image/upload/c_scale,w_388/c_lpad,w_512,h_512,b_rgb:0e0a12/f_png/Isotipo_Science_Play_Oficial_Branca_zge9ut.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/dlzrfhwin/image/upload/c_scale,w_136/c_lpad,w_180,h_180,b_rgb:0e0a12/f_png/Isotipo_Science_Play_Oficial_Branca_zge9ut.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
<script>
  /* Tema antes da primeira pintura, sem piscar branco no escuro. */
  (function(){try{var t=localStorage.getItem('nb-tema');
    if(t==='claro'||t==='escuro')document.documentElement.setAttribute('data-tema',t);}catch(e){}})();
  </script>
</head>
<body>

  <!-- Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App root (preenchido pelo JS) -->
  <div id="app"></div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toastText"></span>
  </div>

  <!-- Estado da rede e da fila de check-in.
       Fica fora do #app porque a tela inteira é reconstruida a cada render;
       aqui ele sobrevive e não pisca. Só aparece quando há o que dizer. -->
  <button class="rede-bar" id="redeBar" hidden aria-live="polite"></button>

  <!-- Modal mount -->
  <div id="modal-mount"></div>

  <!-- App logic (ES Module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
