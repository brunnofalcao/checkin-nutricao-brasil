<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu ingresso · Nutrição Brasil</title>
<meta name="description" content="Adicione seu ingresso do Nutrição Brasil à carteira do celular.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0618">
<link rel="preconnect" href="https://res.cloudinary.com">
<style>
/* =============================================================
   INGRESSO · a página que o link do WhatsApp e do e-mail abre.

   Ela não é parte do app de credenciamento e não usa o styles.css
   dele de propósito: quem abre isto é o participante, uma vez, no
   celular, e nada aqui pode quebrar porque alguém mexeu no painel.

   O link chega como ?i=CODIGO-TOKEN — um pedaço só, sem "&", porque
   botão de URL dinâmica do WhatsApp cola a variável no fim de uma
   URL base e um "&" no meio vira bagunça.
   ============================================================= */
:root{
  --tinta:#0D0618; --papel:#F7F5FA; --caixa:#FFFFFF;
  --linha:#E4DCED; --fraco:#6F6383; --roxo:#5A2475;
  --fundo-cartao:#6f4d89; --texto-cartao:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{ --tinta:#FFFFFF; --papel:#080014; --caixa:#15102B;
         --linha:#2A2547; --fraco:#9A94B8; --roxo:#A78BFA; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:28px 20px calc(32px + env(safe-area-inset-bottom));
  display:flex; justify-content:center;
}
.folha{width:100%; max-width:400px}

.topo{text-align:center; margin-bottom:26px}
.topo img{height:26px; opacity:.9}

h1{
  font-size:25px; line-height:1.2; font-weight:800;
  letter-spacing:-.03em; margin:0 0 8px; text-align:center;
}
.sub{
  font-size:14.5px; line-height:1.5; color:var(--fraco);
  margin:0 0 24px; text-align:center;
}

/* ---------- o cartão ---------- */
.cartao{
  background:var(--fundo-cartao); color:var(--texto-cartao);
  border-radius:20px; padding:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.22);
  margin-bottom:24px; position:relative; overflow:hidden;
}
.cartao-topo{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:22px}
.cartao-logo{height:26px; width:auto; max-width:150px; object-fit:contain}
.cartao-selo{text-align:right; flex:none}
.cartao-selo b{display:block; font-size:13px; font-weight:800; letter-spacing:-.01em; line-height:1.2}
.cartao-selo small{display:block; font-size:9px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; opacity:.72; margin-bottom:2px}
.cartao-rot{font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.72; margin-bottom:3px}
.cartao-nome{font-size:19px; font-weight:700; letter-spacing:-.02em; line-height:1.22; margin-bottom:18px; word-break:break-word}
.cartao-pe{display:flex; gap:26px}
.cartao-pe div{min-width:0}
.cartao-pe b{display:block; font-size:13.5px; font-weight:650; letter-spacing:-.01em}

/* ---------- botões ----------
   Apple e Google proíbem, por escrito, botão recriado à mão: tem que ser
   a arte oficial deles, sem mexer em fonte, cor, raio ou espaçamento.
   Por isso o botão é uma imagem dentro de um link, e o CSS só cuida da
   moldura em volta.

   A arte do Google é uma pílula escura, e a regra manda usar em fundo
   claro. Como esta página tem tema escuro, o badge vai sempre sobre uma
   placa branca — que atende a regra nos dois temas sem tocar na arte. */
.placa{
  display:flex; align-items:center; justify-content:center;
  width:100%; padding:12px;                 /* folga > 8dp exigidos */
  background:#fff; border-radius:16px;
  border:1px solid rgba(0,0,0,.08);
  margin-bottom:10px; text-decoration:none;
  transition:transform .13s ease;
}
.placa:active{transform:scale(.975)}
.placa img{display:block; height:52px; width:auto}   /* mínimo é 48dp */

/* Reserva de quando a arte oficial não carrega. Sem logotipo de marca
   nenhuma de propósito: badge imitado é justamente o que as duas
   proíbem, então aqui é só texto. */
.placa.reserva{
  background:#111; color:#fff; border-color:#111;
  min-height:56px; font-size:15.5px; font-weight:650; letter-spacing:-.015em;
}

/* O segundo aparelho vira link discreto: mostrar dois badges grandes
   lado a lado faz o participante parar para escolher, e 9 em 10 já
   sabem qual é o telefone que têm na mão. */
.outra{
  display:block; text-align:center;
  font-size:13.5px; font-weight:600; color:var(--fraco);
  text-decoration:none; padding:13px 10px; margin-bottom:2px;
}
.outra u{text-decoration-thickness:1px; text-underline-offset:3px}

.ou{
  text-align:center; font-size:12px; color:var(--fraco);
  margin:16px 0 12px; letter-spacing:.01em;
}

/* ---------- código manual ---------- */
.codigo-caixa{
  background:var(--caixa); border:1px solid var(--linha);
  border-radius:15px; padding:16px 18px; text-align:center; margin-top:20px;
}
.codigo-rot{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--fraco); margin-bottom:6px}
.codigo{font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:27px; font-weight:700; letter-spacing:.09em}
.codigo-pe{font-size:12.5px; color:var(--fraco); margin-top:7px; line-height:1.45}

.nota{
  font-size:12.5px; line-height:1.55; color:var(--fraco);
  text-align:center; margin-top:20px;
}

/* ---------- estados ---------- */
.aviso{
  background:var(--caixa); border:1px solid var(--linha);
  border-radius:16px; padding:22px 20px; text-align:center;
}
.aviso b{display:block; font-size:17px; margin-bottom:8px; letter-spacing:-.02em}
.aviso p{margin:0; font-size:14px; line-height:1.55; color:var(--fraco)}
.aviso a{color:var(--roxo); font-weight:600}
.esconde{display:none !important}

.carregando{text-align:center; padding:50px 0; color:var(--fraco); font-size:14px}
.giro{
  width:26px; height:26px; margin:0 auto 14px;
  border:2.5px solid var(--linha); border-top-color:var(--roxo);
  border-radius:50%; animation:gira .7s linear infinite;
}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .giro{animation-duration:2s} .acao:active{transform:none} }
</style>
</head>
<body>
<div class="folha">

  <div class="topo">
    <!-- O arquivo de origem é branco. No tema claro ele precisa da versão
         recolorida, senão some no fundo; no escuro vai como está. -->
    <picture>
      <source media="(prefers-color-scheme: dark)"
              srcset="https://res.cloudinary.com/dlzrfhwin/image/upload/c_fit,w_480,h_150/v1775583229/nb_logotipo_hor_05_wqsydv.png">
      <img id="marca" alt="Nutrição Brasil"
           src="https://res.cloudinary.com/dlzrfhwin/image/upload/c_fit,w_480,h_150/e_colorize,co_rgb:1A0F2E/v1775583229/nb_logotipo_hor_05_wqsydv.png">
    </picture>
  </div>

  <div id="carregando" class="carregando">
    <div class="giro"></div>
    Preparando seu ingresso…
  </div>

  <div id="erro" class="aviso esconde">
    <b id="erro-t">Não consegui abrir este ingresso</b>
    <p id="erro-s"></p>
  </div>

  <div id="pronto" class="esconde">
    <h1 id="titulo">Seu ingresso está pronto</h1>
    <p class="sub" id="subtitulo">Guarde no celular e apresente na entrada.</p>

    <div class="cartao" id="cartao">
      <div class="cartao-topo">
        <img class="cartao-logo" id="cartao-logo" alt="">
        <div class="cartao-selo">
          <small id="c-cab">INGRESSO</small>
          <b id="c-tipo">CONGRESSISTA</b>
        </div>
      </div>
      <div class="cartao-rot">Participante</div>
      <div class="cartao-nome" id="c-nome">—</div>
      <div class="cartao-pe">
        <div><div class="cartao-rot">Datas</div><b id="c-datas">—</b></div>
        <div><div class="cartao-rot">Local</div><b id="c-local">—</b></div>
      </div>
    </div>

    <div id="botoes"></div>

    <div class="codigo-caixa">
      <div class="codigo-rot">Se preferir, seu código</div>
      <div class="codigo" id="c-codigo">—</div>
      <div class="codigo-pe">Serve no credenciamento do mesmo jeito.</div>
    </div>

    <p class="nota" id="nota"></p>
  </div>
</div>

<script>
(function () {
  var FUNCAO = 'https://tjrarpnqoemdhxjjbtgk.supabase.co/functions/v1/wallet-passe';
  var CL = 'https://res.cloudinary.com/dlzrfhwin/image/upload';
  var LOGO = 'v1775583229/nb_logotipo_hor_05_wqsydv.png';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };

  function falha(titulo, texto) {
    $('carregando').classList.add('esconde');
    $('erro').classList.remove('esconde');
    $('erro-t').textContent = titulo;
    $('erro-s').innerHTML = texto;
  }

  // ---- o link vem como ?i=CODIGO-TOKEN; o token é a última parte ----
  var i = new URLSearchParams(location.search).get('i') || '';
  var corte = i.lastIndexOf('-');
  var codigo = corte > 0 ? i.slice(0, corte) : '';
  var token  = corte > 0 ? i.slice(corte + 1) : '';

  if (!codigo || !token) {
    falha('Link incompleto',
      'O endereço veio cortado. Isso acontece quando a mensagem é copiada pela metade. ' +
      'Abra o link direto da mensagem original, ou fale com a gente pelo WhatsApp do evento.');
    return;
  }

  var base = FUNCAO + '?e=' + encodeURIComponent(codigo) + '&t=' + encodeURIComponent(token);

  // ---- que aparelho é ----
  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);

  // Artes OFICIAIS. Trocar aqui é a única coisa necessária quando chegar
  // o badge da Apple — o arquivo dela fica atrás do portal de download,
  // que exige conta de desenvolvedor.
  var BADGE = {
    google: 'https://res.cloudinary.com/dlzrfhwin/image/upload/v1787001220/nb2026/botao_google_wallet_pt.svg',
    apple:  'https://res.cloudinary.com/dlzrfhwin/image/upload/v1787001220/nb2026/botao_apple_wallet_pt.svg',
  };

  function placa(loja, href, alt) {
    return '<a class="placa" href="' + esc(href) + '">' +
           '<img src="' + esc(BADGE[loja]) + '" alt="' + esc(alt) + '"></a>';
  }
  function outra(href, texto) {
    return '<a class="outra" href="' + esc(href) + '"><u>' + esc(texto) + '</u></a>';
  }

  var pApple  = placa('apple',  base, 'Adicionar à Apple Wallet');
  var pGoogle = placa('google', base + '&f=google', 'Adicionar ao Google Wallet');
  var oApple  = outra(base, 'Tenho iPhone — adicionar à Apple Wallet');
  var oGoogle = outra(base + '&f=google', 'Tenho Android — adicionar ao Google Wallet');

  // ---- busca os dados para montar a prévia ----
  fetch(base + '&f=json')
    .then(function (r) {
      if (r.status === 403) throw new Error('403');
      if (r.status === 404) throw new Error('404');
      if (!r.ok) throw new Error('http' + r.status);
      return r.json();
    })
    .then(function (d) {
      if (d.erro) throw new Error('dados');

      document.documentElement.style.setProperty('--fundo-cartao', d.fundo);
      var claro = !!d.texto_escuro;                 // fundo claro pede tinta escura
      document.documentElement.style.setProperty('--texto-cartao', claro ? '#0D0618' : '#FFFFFF');
      $('cartao-logo').src = CL + '/c_fit,w_320,h_100' +
        (claro ? '/e_colorize,co_rgb:1A0F2E' : '') + '/' + LOGO;

      var CAB = { congressista:'INGRESSO', nbrun:'CORRIDA', visitante:'ACESSO',
                  expositor:'CREDENCIAL', patrocinio:'COTA', apoio:'COTA' };
      $('c-cab').textContent = CAB[d.tipo] || 'INGRESSO';
      $('c-tipo').textContent = d.rotulo || '';
      $('c-nome').textContent = d.nome || '';
      $('c-datas').textContent = d.datas || '';
      $('c-local').textContent = d.cidade || '';
      $('c-codigo').textContent = d.codigo || codigo;

      var pnome = String(d.nome || '').trim().split(/\s+/)[0];
      $('titulo').textContent = pnome ? (pnome + ', seu ingresso está pronto') : 'Seu ingresso está pronto';
      $('subtitulo').textContent = d.tipo === 'nbrun'
        ? 'Guarde no celular e apresente na retirada do kit.'
        : 'Guarde no celular e apresente na entrada. Funciona sem internet.';

      // ordem pelo aparelho; o outro fica disponível mas discreto
      $('botoes').innerHTML = iOS      ? pApple + oGoogle
                            : android  ? pGoogle + oApple
                            : '<div class="ou">Abra no celular para guardar na carteira</div>' + pApple + pGoogle;

      $('nota').textContent = iOS || android
        ? 'Depois de adicionar, ele fica na carteira do celular mesmo sem sinal.'
        : 'Você também pode fazer o check-in só com o código acima.';

      // Se um badge oficial não carregar — arquivo ainda não hospedado,
      // CDN fora do ar — a placa vira um botão de texto. O participante
      // nunca fica olhando para uma imagem quebrada sem saber onde tocar.
      Array.prototype.forEach.call($('botoes').querySelectorAll('.placa img'), function (img) {
        img.addEventListener('error', function () {
          var a = img.parentNode;
          a.className = 'placa reserva';
          a.textContent = img.getAttribute('alt') || 'Adicionar à carteira';
        });
      });

      $('carregando').classList.add('esconde');
      $('pronto').classList.remove('esconde');
    })
    .catch(function (e) {
      var m = String(e && e.message);
      if (m === '403') {
        falha('Este link não confere',
          'Ele pode ter sido copiado pela metade ou alterado. Abra direto da mensagem que você recebeu.');
      } else if (m === '404') {
        falha('Não achei esta inscrição',
          'O código <b>' + esc(codigo) + '</b> não está na nossa lista. ' +
          'Se você acabou de se inscrever, espere alguns minutos e tente de novo.');
      } else {
        falha('Não consegui carregar agora',
          'Pode ser a conexão. Tente de novo em instantes — seu ingresso continua valendo, ' +
          'e no credenciamento o código <b>' + esc(codigo) + '</b> resolve.');
      }
    });
})();
</script>
</body>
</html>
